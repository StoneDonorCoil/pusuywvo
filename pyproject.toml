[project]
name = "telegram-edu-bot"
version = "1.0.0"
description = "Telegram bot for selling educational video courses"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.4.1",
    "aiosqlite==0.19.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
