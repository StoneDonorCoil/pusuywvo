name: BossRaid
main: com.mcevents.bossraid.BossRaidPlugin
version: "1.0.0"
api: ["1.0.0"]
author: MCEvents
description: "Рейд на Босса — совместный ивент с фазами и наградами по урону"
commands:
  boss:
    description: "Основная команда BossRaid"
    usage: "/boss <join|info|top|start|stop|setspawn|list|reload>"
    permission: boss.use
permissions:
  boss.use:
    description: "Доступ к базовым командам Boss"
    default: true
  boss.admin:
    description: "Администрирование BossRaid"
    default: op
