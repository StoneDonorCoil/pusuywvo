name: KingOfTheHill
main: com.mcevents.kingofthehill.KothPlugin
version: "1.0.0"
api: ["1.0.0"]
author: MCEvents
description: "Царь Горы — захватывай и удерживай точку"
commands:
  koth:
    description: "Основная команда KOTH"
    usage: "/koth <join|leave|score|top|start|stop|setzone|reload>"
    permission: koth.use
permissions:
  koth.use:
    description: "Доступ к базовым командам KOTH"
    default: true
  koth.admin:
    description: "Администрирование KOTH"
    default: op
