# ============================================
#     KING OF THE HILL — НАСТРОЙКИ
# ============================================
# Захвати точку и удерживай её дольше всех!
# Один игрок в зоне = набирает очки
# Несколько игроков = никто не набирает (нужно сражаться!)
# ============================================

settings:
  # Длительность ивента (секунды)
  event-duration: 900

  # Очки для победы
  # Если игрок набирает это количество — побеждает досрочно
  points-to-win: 300

  # Интервал начисления очков (секунды)
  # Каждые N секунд игрок в зоне получает 1 очко
  score-interval: 1

  # Награды
  rewards:
    first:
      money: 1000
    second:
      money: 500
    third:
      money: 250

# Зона захвата
# Устанавливается через /koth setzone pos1 и /koth setzone pos2
# zone:
#   pos1:
#     world: "world"
#     x: 100.0
#     y: 64.0
#     z: 100.0
#   pos2:
#     world: "world"
#     x: 110.0
#     y: 70.0
#     z: 110.0
