# ============================================
#     TREASURE HUNT — НАСТРОЙКИ
# ============================================
# Плагин "Охота за Сокровищами"
# Игроки ищут спрятанные сокровища по подсказкам
# ============================================

settings:
  # Длительность ивента в секундах (1800 = 30 минут)
  event-duration: 1800

  # Радиус обнаружения сокровища (в блоках)
  # Когда игрок подходит на это расстояние — сокровище считается найденным
  find-radius: 3.0

  # Очки за каждый уровень сокровища
  # Уровень 1 — лёгкое, 5 — очень сложное/спрятанное
  tier-points:
    1: 10
    2: 25
    3: 50
    4: 100
    5: 250

  # Интервал между подсказками (в секундах)
  # Игрок не может спамить /th hint чаще
  hint-cooldown: 15

  # Награды за место в топе
  rewards:
    first:
      money: 1000
      items:
        - id: 264
          count: 5
    second:
      money: 500
      items:
        - id: 264
          count: 3
    third:
      money: 250
      items:
        - id: 264
          count: 1

# Сокровища добавляются через /th addtreasure <имя> [уровень]
# Или вручную в этом конфиге:
# treasures:
#   treasure1:
#     x: 100.0
#     y: 64.0
#     z: 200.0
#     world: "world"
#     tier: 3
treasures: {}
