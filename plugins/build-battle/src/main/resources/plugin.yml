name: BuildBattle
main: com.mcevents.buildbattle.BuildBattlePlugin
version: "1.0.0"
api: ["1.0.0"]
author: MCEvents
description: "Битва Строителей — соревнование по строительству с голосованием"
commands:
  bb:
    description: "Основная команда BuildBattle"
    usage: "/bb <join|leave|theme|vote|start|stop|addplot|reload>"
    permission: bb.use
permissions:
  bb.use:
    description: "Доступ к базовым командам BB"
    default: true
  bb.admin:
    description: "Администрирование BuildBattle"
    default: op
