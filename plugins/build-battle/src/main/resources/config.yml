# ============================================
#     BUILD BATTLE — НАСТРОЙКИ
# ============================================
# Битва Строителей с голосованием
# ============================================

settings:
  # Минимум игроков для старта
  min-players: 2

  # Максимум игроков
  max-players: 12

  # Время на строительство (секунды)
  build-time: 300

  # Время голосования за каждый участок (секунды)
  voting-time-per-plot: 20

  # Список тем (случайный выбор при /bb start без аргумента)
  themes:
    - "Замок"
    - "Космическая станция"
    - "Подводный мир"
    - "Средневековая деревня"
    - "Город будущего"
    - "Японский сад"
    - "Пиратский корабль"
    - "Заброшенный храм"
    - "Волшебный лес"
    - "Вулканический остров"
    - "Ледяной дворец"
    - "Стимпанк фабрика"
    - "Тропический рай"
    - "Драконье логово"
    - "Школа магии"

  # Награды
  rewards:
    first:
      money: 500
    second:
      money: 300
    third:
      money: 150

# Участки для строительства
# Добавляйте через /bb addplot <номер>
plots: {}
