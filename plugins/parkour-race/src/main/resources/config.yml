# ============================================
#     PARKOUR RACE — НАСТРОЙКИ
# ============================================
# Паркур-гонка с чекпоинтами и таблицей рекордов
# ============================================

settings:
  # Максимальное время гонки (секунды)
  race-duration: 600

  # Радиус обнаружения чекпоинта (блоки)
  checkpoint-radius: 2.5

  # Награды
  rewards:
    first-money: 500
    second-money: 300
    third-money: 150

# Стартовая позиция: /parkour setstart
# start:
#   world: "world"
#   x: 0.0
#   y: 64.0
#   z: 0.0

# Финишная позиция: /parkour setfinish
# finish:
#   world: "world"
#   x: 100.0
#   y: 64.0
#   z: 100.0

# Чекпоинты: /parkour addcp [номер]
# Нумерация определяет порядок прохождения
# checkpoints:
#   1:
#     world: "world"
#     x: 20.0
#     y: 65.0
#     z: 20.0
#   2:
#     world: "world"
#     x: 50.0
#     y: 70.0
#     z: 50.0
