name: ParkourRace
main: com.mcevents.parkourrace.ParkourRacePlugin
version: "1.0.0"
api: ["1.0.0"]
author: MCEvents
description: "Паркур-Гонка — соревнование на скорость с чекпоинтами"
commands:
  parkour:
    description: "Основная команда ParkourRace"
    usage: "/parkour <join|leave|time|top|start|stop|setstart|setfinish|addcp|reload>"
    permission: parkour.use
permissions:
  parkour.use:
    description: "Доступ к базовым командам Parkour"
    default: true
  parkour.admin:
    description: "Администрирование ParkourRace"
    default: op
