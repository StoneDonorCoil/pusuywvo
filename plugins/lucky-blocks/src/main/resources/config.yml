# ============================================
#     LUCKY BLOCKS — НАСТРОЙКИ
# ============================================
# Лаки-блоки с рандомными наградами и ловушками
# Ломай лаки-блоки и получай случайные эффекты!
# ============================================

settings:
  # ID блока, который будет лаки-блоком
  # По умолчанию: 19 (Sponge/Губка) — легко узнаваемый блок
  # Можно поставить любой ID блока
  lucky-block-id: 19

  # Длительность ивента (секунды)
  event-duration: 900

  # Шансы результатов (в процентах, сумма = 100)
  # Хороший результат (предметы, положительные эффекты)
  good-chance: 45
  # Плохой результат (взрывы, мобы, отравление)
  bad-chance: 30
  # Нейтральный (ничего или мелочь)
  # neutral-chance: 25 (автоматически = 100 - good - bad)

  # Сила взрыва при плохом результате (1-10)
  explosion-power: 3

  # Награды за место
  rewards:
    first-money: 500
    second-money: 300
    third-money: 150
