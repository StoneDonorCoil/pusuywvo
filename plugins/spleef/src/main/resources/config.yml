# ============================================
#     SPLEEF — НАСТРОЙКИ
# ============================================
# Классический Spleef — ломайте блоки под ногами противников!
# ============================================

settings:
  # Минимум игроков для старта
  min-players: 2

  # Максимум игроков
  max-players: 16

  # Обратный отсчёт (секунды)
  countdown: 15

  # Максимальное время игры (секунды)
  game-time: 300

  # Давать снежки (сбивать противников)
  give-snowballs: true

  # Награды
  rewards:
    winner-money: 300

# Арена
# Спавн: /spleef setspawn
# Уровень падения: /spleef setfall (встаньте на уровень, ниже которого — выбывание)
arena:
  fall-level: 50.0
