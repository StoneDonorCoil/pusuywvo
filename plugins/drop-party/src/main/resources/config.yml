# ============================================
#     DROP PARTY — НАСТРОЙКИ
# ============================================
# Дроп-пати: предметы падают с неба!
# Игроки собирают предметы в зоне дропа
# ============================================

settings:
  # Длительность ивента (секунды)
  duration: 300

  # Интервал между дропами (секунды)
  # Каждые N секунд падает порция предметов
  drop-interval: 2

  # Количество предметов за один дроп
  items-per-drop: 5

  # Высота, с которой падают предметы (блоки над зоной)
  drop-height: 30

  # Награды за место в топе
  rewards:
    first-money: 300
    second-money: 200
    third-money: 100

# Зона дропа
# Устанавливается через /dp setzone pos1 и /dp setzone pos2
# zone:
#   pos1:
#     world: "world"
#     x: 0.0
#     y: 64.0
#     z: 0.0
#   pos2:
#     world: "world"
#     x: 30.0
#     y: 64.0
#     z: 30.0

# Таблица лута
# id — ID предмета
# damage — мета/дамаг
# count — количество
# weight — вес (чем больше, тем чаще выпадает)
loot-table:
  diamond:
    id: 264
    damage: 0
    count: 1
    weight: 2
  iron:
    id: 265
    damage: 0
    count: 3
    weight: 10
  gold:
